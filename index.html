<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yasith Wijesuriya</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-6 md:p-8">

        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center border-b border-slate-200 pb-5 mb-6">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Salary Management</h1>
                <p class="text-slate-500 text-sm mt-1">Managed by <span class="font-semibold text-indigo-600">Yasith
                        Wijesuriya</span></p>
            </div>
            <div class="mt-4 md:mt-0">
                <button onclick="toggleForm()" id="toggleBtn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md transition duration-200 shadow-md flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                            clip-rule="evenodd" />
                    </svg>
                    Add New Record
                </button>
            </div>
        </div>

        <!-- Form Section (Hidden by default) -->
        <div id="formContainer" class="hidden transition-all duration-300 ease-in-out mb-8">
            <form id="salaryForm" onsubmit="addRecord(event)"
                class="bg-slate-50 p-6 rounded-lg border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2 flex justify-between items-center mb-2">
                    <h2 class="text-lg font-semibold text-slate-700">Add Salary Record</h2>
                    <button type="button" onclick="toggleForm()"
                        class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
                </div>

                <!-- Month Selection -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Month</label>
                    <select id="month" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Select Month</option>
                        <option value="January 2026">January 2026</option>
                        <option value="February 2026">February 2026</option>
                        <option value="March 2026">March 2026</option>
                        <option value="April 2026">April 2026</option>
                        <option value="May 2026">May 2026</option>
                        <option value="June 2026">June 2026</option>
                        <option value="July 2026">July 2026</option>
                        <option value="August 2026">August 2026</option>
                        <option value="September 2026">September 2026</option>
                        <option value="October 2026">October 2026</option>
                        <option value="November 2026">November 2026</option>
                        <option value="December 2026">December 2026</option>
                    </select>
                </div>

                <!-- Date Selection -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                    <input type="date" id="date" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Basic Salary -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Basic Salary</label>
                    <input type="number" id="basic" step="0.01" placeholder="e.g. 50000" oninput="calculateTotal()"
                        required
                        class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- OT Amount -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">OT Amount</label>
                    <input type="number" id="ot" step="0.01" placeholder="e.g. 25000" oninput="calculateTotal()"
                        required
                        class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <!-- Total Amount -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Total Amount</label>
                    <input type="text" id="total" readonly
                        class="w-full px-3 py-2 bg-slate-200 border border-slate-300 rounded-md text-slate-700 font-semibold cursor-not-allowed">
                </div>

                <!-- Slip Image Upload -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Slip Image</label>
                    <input type="file" id="slipImage" accept="image/*" required
                        class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>

                <!-- Submit Button -->
                <div class="md:col-span-2 mt-2 flex gap-3">
                    <button type="submit" id="submitBtn"
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-md transition duration-200 shadow-md">
                        Save Record
                    </button>
                    <button type="button" onclick="toggleForm()"
                        class="bg-slate-300 hover:bg-slate-400 text-slate-700 font-medium py-2.5 px-4 rounded-md transition duration-200">
                        Cancel
                    </button>
                </div>
            </form>
        </div>

        <!-- Records Table Section (Primary View) -->
        <div>
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-slate-800">Salary & OT Records</h2>
                <button onclick="fetchRecords()"
                    class="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Refresh Data
                </button>
            </div>

            <div class="overflow-x-auto rounded-lg border border-slate-200 shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-sm">
                            <th class="p-3 border-b border-slate-200">Month</th>
                            <th class="p-3 border-b border-slate-200">Basic Salary</th>
                            <th class="p-3 border-b border-slate-200">OT</th>
                            <th class="p-3 border-b border-slate-200">Total</th>
                            <th class="p-3 border-b border-slate-200">Date</th>
                            <th class="p-3 border-b border-slate-200">Slip</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody" class="text-sm text-slate-600">
                        <tr>
                            <td colspan="6" class="text-center p-6 text-slate-400">Loading records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzyLCaYl-h4uUUnTyRxTVZZDt7OaN8UGqPwoRtuIWBl1doJY-BmzCugd4hHy-qGOoe09g/exec";

        // Toggle Form Visibility
        function toggleForm() {
            let formContainer = document.getElementById('formContainer');
            let toggleBtn = document.getElementById('toggleBtn');
            if (formContainer.classList.contains('hidden')) {
                formContainer.classList.remove('hidden');
                toggleBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    Close Form
                `;
            } else {
                formContainer.classList.add('hidden');
                toggleBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    Add New Record
                `;
            }
        }

        // Calculate Total Automatically
        function calculateTotal() {
            let basic = parseFloat(document.getElementById('basic').value) || 0;
            let ot = parseFloat(document.getElementById('ot').value) || 0;
            let total = basic + ot;
            document.getElementById('total').value = total.toFixed(2);
        }

        // Add Record Function
        function addRecord(event) {
            event.preventDefault();

            let submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving record, please wait...";

            let month = document.getElementById('month').value;
            let date = document.getElementById('date').value;
            let basic = document.getElementById('basic').value;
            let ot = document.getElementById('ot').value;
            let total = document.getElementById('total').value;
            let fileInput = document.getElementById('slipImage');

            let file = fileInput.files[0];
            let reader = new FileReader();

            reader.onload = function (e) {
                let base64Image = e.target.result;
                let payload = {
                    month: month,
                    date: date,
                    basic: basic,
                    ot: ot,
                    total: total,
                    image: base64Image,
                    fileName: file.name,
                    mimeType: file.type
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                })
                    .then(response => {
                        alert('Record saved successfully!');
                        document.getElementById('salaryForm').reset();
                        document.getElementById('total').value = '';
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Save Record";

                        toggleForm(); // Close form after success
                        setTimeout(fetchRecords, 2000);
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('An error occurred. Please try again.');
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Save Record";
                    });
            };

            reader.readAsDataURL(file);
        }

        // Fetch Records from Google Sheet
        function fetchRecords(retries = 3) {
            let tbody = document.getElementById('recordsTableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-slate-400">Loading records...</td></tr>`;

            fetch(SCRIPT_URL)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    tbody.innerHTML = '';

                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-slate-400">No records found.</td></tr>`;
                        return;
                    }

                    let currentDate = new Date();

                    data.forEach(row => {
                        let tr = document.createElement('tr');
                        tr.className = "border-b border-slate-200 hover:bg-slate-50";

                        let recordDate = new Date(row.date);
                        if (recordDate < new Date(currentDate.getFullYear(), currentDate.getMonth(), 1)) {
                            tr.className += " bg-red-100 hover:bg-red-200 text-red-800 font-medium";
                        }

                        tr.innerHTML = `
                        <td class="p-3 border-b border-slate-200">${row.month || ''}</td>
                        <td class="p-3 border-b border-slate-200">Rs. ${row.basic ? parseFloat(row.basic).toLocaleString() : '0'}</td>
                        <td class="p-3 border-b border-slate-200">Rs. ${row.ot ? parseFloat(row.ot).toLocaleString() : '0'}</td>
                        <td class="p-3 border-b border-slate-200 font-semibold">Rs. ${row.total ? parseFloat(row.total).toLocaleString() : '0'}</td>
                        <td class="p-3 border-b border-slate-200">${row.date || ''}</td>
                        <td class="p-3 border-b border-slate-200">
                            ${row.image ? `<a href="${row.image}" target="_blank" class="text-indigo-600 underline hover:text-indigo-800 font-medium">View Slip</a>` : 'None'}
                        </td>
                    `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    console.warn('Fetch attempt failed, retries left:', retries);
                    if (retries > 0) {
                        setTimeout(() => fetchRecords(retries - 1), 2000);
                    } else {
                        console.error('Error fetching data:', error);
                        tbody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-red-500">Failed to load data. Please refresh the page.</td></tr>`;
                    }
                });
        }

        window.onload = fetchRecords;
    </script>
</body>

</html>
